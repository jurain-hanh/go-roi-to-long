<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gỡ Rối Tơ Lòng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: one bright phone screen on a soft ground; onboarding as full-screen steps, then a chat and a weekly plan. Single light look by choice. */
:root {
  color-scheme: light;
  --ground: #EEEEF0;
  --bg: #FFFFFF;
  --soft: #F5F5F7;
  --ink: #17171B;
  --muted: #6D6D78;
  --line: #E9E9EE;
  --violet: #8B8BF2; --teal: #58BC9C; --coral: #F27C5B; --butter: #F6C64A; --pink: #F7D6CF; --sky: #9CCBE8;
  --paper-y: #FFF3B5; --paper-p: #E7E4FF;
  --warn: #B4471F; --warn-bg: #FFF0E9;
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 10px; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.phone { width: 100%; max-width: 390px; height: min(820px, calc(100vh - 70px)); min-height: 600px; background: var(--bg); border-radius: 40px; border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(23,23,27,.10); position: relative; overflow: hidden; display: flex; flex-direction: column; }
@media (max-width: 480px) {
  body { padding: 0; }
  .label { display: none; }
  .phone { max-width: none; height: 100%; min-height: 0; border-radius: 0; border: 0; box-shadow: none; }
}
.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 0; min-height: 52px; }
.back { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.back:hover { background: var(--soft); }
.dots { display: flex; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 6px; background: var(--line); }
.dots i.on { width: 18px; background: var(--ink); }
.body { flex: 1; overflow-y: auto; padding: 8px 22px 16px; display: flex; flex-direction: column; gap: 16px; }
.body > * { flex-shrink: 0; }
.foot { padding: 10px 22px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; letter-spacing: -.01em; }
h1 { font-size: 30px; font-weight: 800; text-align: center; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 13px; text-align: center; }
.hint { color: var(--muted); font-size: 12px; text-align: center; }
.btn { width: 100%; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 600 15px var(--font-body); padding: 15px 20px; cursor: pointer; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.light { background: var(--soft); color: var(--ink); }
.btn.small { width: auto; padding: 10px 16px; font-size: 13px; }
.link { background: none; border: 0; color: var(--ink); font: 600 12px var(--font-body); text-decoration: underline; cursor: pointer; padding: 2px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

/* Welcome */
.welcome { position: relative; flex: 1; display: grid; place-items: center; min-height: 420px; }
.note { position: absolute; font-family: "Baloo 2", cursive; font-size: 13px; line-height: 1.15; padding: 12px 12px; width: 104px; box-shadow: 0 6px 16px rgba(23,23,27,.08); }
.note.y { background: var(--paper-y); }
.note.p { background: var(--paper-p); }
.note.w { background: #fff; border: 1px solid var(--line); }
.pin { position: absolute; top: -9px; left: 44%; width: 14px; height: 14px; border-radius: 50%; background: var(--coral); box-shadow: inset -2px -2px 0 rgba(0,0,0,.15); }
.welcome-text { text-align: center; font-size: 21px; font-weight: 600; line-height: 1.35; max-width: 250px; font-family: var(--font-body); }
.arrow { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); }

/* Choice list */
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; background: var(--soft); border: 2px solid transparent; border-radius: 18px; cursor: pointer; font: 500 15px var(--font-body); color: var(--ink); text-align: left; }
.choice[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
.choice svg { flex: none; }

/* Companion carousel */
.carousel { display: flex; align-items: center; gap: 10px; }
.card { flex: 1; border-radius: 28px; padding: 22px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; min-height: 290px; justify-content: center; transition: background .3s; }
.tagpill { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: rgba(255,255,255,.7); border-radius: 999px; padding: 3px 10px; }
.card p { font-size: 14px; max-width: 210px; }
.peek { width: 18px; height: 200px; border-radius: 0 18px 18px 0; background: var(--soft); border: 0; cursor: pointer; }
.peek.r { border-radius: 18px 0 0 18px; }
.pager { display: flex; justify-content: center; gap: 6px; }
.pager i { width: 6px; height: 6px; border-radius: 6px; background: var(--line); }
.pager i.on { width: 16px; background: var(--coral); }
.cname { font-family: var(--font-display); font-size: 22px; font-weight: 800; text-align: center; }

/* Time ring */
.ring { position: relative; width: 210px; height: 210px; margin: 0 auto; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring .num { font-family: var(--font-display); font-size: 52px; font-weight: 800; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.ring .unit { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: center; }
.seg { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.seg button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 14px; font: 600 13px var(--font-body); cursor: pointer; color: var(--ink); }
.seg button[aria-pressed="true"] { border-color: var(--ink); }
.seg small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--soft); border-radius: 18px; padding: 12px 16px; }
.toggle { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
.toggle[aria-pressed="true"] { background: var(--teal); }
.toggle[aria-pressed="true"]::after { left: 21px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { background: var(--soft); border-radius: 16px; padding: 10px 12px; }
.fact b { display: block; font-family: var(--font-display); font-size: 18px; }
.fact span { font-size: 12px; color: var(--muted); }

/* Chat */
.stepper { display: flex; gap: 6px; padding: 0 22px 8px; }
.stepper button { flex: 1; border: 0; background: var(--soft); border-radius: 12px; padding: 7px 4px; font: 600 11.5px var(--font-body); color: var(--muted); cursor: pointer; }
.stepper button[aria-current="step"] { background: var(--ink); color: #fff; }
.stepper button.done { background: #E6F5EF; color: #2C7A61; }
.chat { flex: 1; overflow-y: auto; padding: 8px 18px 12px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.msg .bubble { padding: 10px 14px; border-radius: 20px; font-size: 14.5px; line-height: 1.5; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.ai .bubble { background: var(--soft); border-bottom-left-radius: 6px; }
.msg.me { justify-content: flex-end; }
.msg.me .bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 6px; }
.msg .av { flex: none; }
.typing { display: inline-flex; gap: 4px; }
.typing b { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing b:nth-child(2) { animation-delay: .2s; } .typing b:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.quick { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 8px; scrollbar-width: none; }
.quick button { flex: none; border: 1.5px dashed #C9C9D6; background: #fff; border-radius: 999px; padding: 7px 12px; font: 500 12.5px var(--font-body); color: var(--ink); cursor: pointer; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: var(--soft); border-radius: 20px; padding: 11px 14px; font: 14.5px/1.4 var(--font-body); color: var(--ink); resize: none; max-height: 110px; }
.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .3; }
.notice { margin: 0 18px; background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 8px 12px; font-size: 12.5px; }
.notice b { font-weight: 600; }
.aibtn { display: block; margin-top: 8px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 600 13px var(--font-body); padding: 7px 14px; cursor: pointer; }

/* Plan */
.tabs2 { display: flex; background: var(--soft); border-radius: 999px; padding: 4px; }
.tabs2 button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 8px; font: 600 13px var(--font-body); cursor: pointer; color: var(--muted); }
.tabs2 button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.meter { background: var(--soft); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.meter .bar { height: 10px; border-radius: 10px; background: #fff; overflow: hidden; position: relative; }
.meter .bar span { position: absolute; inset: 0 auto 0 0; background: var(--teal); border-radius: 10px; }
.meter .bar span.over { background: var(--coral); }
.meter .nums { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 16px; padding: 12px 14px; font-size: 13.5px; }
.prio { display: flex; flex-direction: column; gap: 8px; }
.prio-item { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.prio-item .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 14px var(--font-display); color: var(--ink); }
.prio-item .t { min-width: 0; }
.prio-item .t small { display: block; color: var(--muted); font-size: 12.5px; }
.day { display: flex; flex-direction: column; gap: 6px; }
.day h3 { font-size: 15px; }
.blk { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: start; padding: 9px 12px; border-radius: 14px; background: var(--soft); font-size: 13.5px; }
.blk .tm { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; }
.blk.hoc { background: #EEEEFF; } .blk.lam { background: #F3F3F5; color: var(--muted); } .blk.nghi { background: #E7F6F0; } .blk.ngu { background: #FFF6DA; }
.thinking { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 30px 0; color: var(--muted); font-size: 13px; text-align: center; }
.bob { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .bob, .typing b { animation: none; } }

/* Stamp */
.stamp { width: 190px; margin: 6px auto 0; padding: 12px; background: #fff; border: 2px dashed #E3C7BB; border-radius: 6px; }
.stamp-in { background: var(--coral); color: #FFE9DF; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.stamp-in .row1, .stamp-in .row2 { width: 100%; display: flex; justify-content: space-between; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
</style>
</head>
<body>

<div class="label">Prototype · Trợ lý AI cho sinh viên vừa học vừa làm</div>
<div class="phone" id="phone"></div>

<script>
(() => {
/* ---------- characters (original blobs) ---------- */
function blob(color, lobes, amp, size = 64, mood = "smile", rot = 0) {
  const R = 40, pts = [];
  for (let i = 0; i < 96; i++) {
    const t = i / 96 * Math.PI * 2;
    const r = R * (1 + amp * Math.cos(lobes * (t + rot)));
    pts.push(`${(50 + r * Math.cos(t)).toFixed(1)},${(52 + r * Math.sin(t)).toFixed(1)}`);
  }
  const mouth = { smile: '<path d="M43 64 Q50 70 57 64" stroke="#17171B" stroke-width="3" fill="none" stroke-linecap="round"/>',
    wink: '<path d="M44 65 Q50 69 56 65" stroke="#17171B" stroke-width="3" fill="none" stroke-linecap="round"/>',
    calm: '<path d="M45 66 L55 66" stroke="#17171B" stroke-width="3" stroke-linecap="round"/>',
    open: '<ellipse cx="50" cy="66" rx="4.5" ry="3.5" fill="#17171B"/>' }[mood];
  const eyeL = mood === "wink" ? '<path d="M33 50 Q39 45 45 50" stroke="#17171B" stroke-width="3" fill="none" stroke-linecap="round"/>' : '<ellipse cx="39" cy="50" rx="7.5" ry="8.5" fill="#fff"/><circle cx="40.5" cy="51.5" r="4" fill="#17171B"/>';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${pts.join(" ")}" fill="${color}" stroke="#17171B" stroke-width="2.4" stroke-linejoin="round"/>${eyeL}<ellipse cx="61" cy="50" rx="7.5" ry="8.5" fill="#fff"/><circle cx="62.5" cy="51.5" r="4" fill="#17171B"/>${mouth}</svg>`;
}
const COMPANIONS = [
  { id: "bong", name: "Bông", tag: "Dịu dàng", color: "var(--violet)", soft: "#EEEEFF", lobes: 4, amp: .07, mood: "smile",
    line: "Tuần này nặng quá hả? Kể mình nghe, từng chuyện một thôi.", note: "Lắng nghe trước, khuyên sau.",
    tone: "Giọng nhẹ nhàng, ưu tiên lắng nghe và gọi tên cảm xúc." },
  { id: "tic", name: "Tíc", tag: "Gọn gàng", color: "var(--teal)", soft: "#E7F6F0", lobes: 3, amp: .16, mood: "calm",
    line: "Đưa mình danh sách việc, mình xếp cho vừa thời gian của bạn.", note: "Giỏi chia nhỏ việc và lên lịch.",
    tone: "Giọng rõ ràng, ngắn gọn, thích chia việc thành bước nhỏ." },
  { id: "cam", name: "Cam", tag: "Vui vẻ", color: "var(--coral)", soft: "#FDEAE3", lobes: 4, amp: .2, mood: "wink",
    line: "Não đầy tab rồi à? Mình đóng bớt vài cái nhé.", note: "Một chút hài hước cho nhẹ lòng.",
    tone: "Giọng vui vẻ, ấm áp, thỉnh thoảng đùa nhẹ nhưng không xem nhẹ cảm xúc." },
  { id: "mat", name: "Mật", tag: "Chu đáo", color: "var(--butter)", soft: "#FFF6DA", lobes: 6, amp: .09, mood: "smile",
    line: "Deadline quan trọng, nhưng giấc ngủ của bạn cũng vậy.", note: "Luôn giữ chỗ cho giờ ngủ và nghỉ.",
    tone: "Giọng chu đáo, luôn nhắc giữ giờ ngủ và nghỉ ngơi." }
];
const NEEDS = [
  { k: "Gỡ rối deadline", c: "var(--violet)", l: 4, a: .07, m: "open" },
  { k: "Nói ra cảm xúc", c: "var(--teal)", l: 3, a: .16, m: "calm" },
  { k: "Sắp xếp lịch tuần", c: "var(--coral)", l: 4, a: .2, m: "wink" },
  { k: "Ngủ đủ giấc hơn", c: "var(--butter)", l: 6, a: .09, m: "smile" }
];

/* ---------- state ---------- */
const S = { step: 0, needs: ["Gỡ rối deadline", "Sắp xếp lịch tuần"], comp: 0, endStudy: "22:30", start: "19:30", nudge: true,
  turns: [], phase: 0, plan: null, planState: "idle", planMsg: "", planTab: "ai", extra: [], aiOff: false };
const comp = () => COMPANIONS[S.comp];
const phone = document.getElementById("phone");
const esc = s => fixVi(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const backIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const sendIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const eveningHours = () => (toMin(S.endStudy) - toMin(S.start)) / 60;

/* ---------- AI ---------- */
const HAS_HOST = !!(window.claude && claude.use);
const samplePromise = HAS_HOST ? claude.use("sample").catch(() => null) : Promise.resolve(null);
const permsPromise = HAS_HOST ? claude.use("permissions").catch(() => null) : Promise.resolve(null);
const BLOCK = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
/* Trạng thái AI: checking | ready | prompt | denied | disabled | unavailable | nohost */
const AI = { status: HAS_HOST ? "checking" : "nohost" };
const AI_CODE = { not_granted: "denied", sampling_disabled: "disabled", not_declared: "unavailable", capability_disabled: "unavailable", capability_removed: "unavailable" };
function aiReason() {
  return {
    nohost: "Đây là bản demo công khai, không kết nối AI. Mở link trên claude.ai để dùng AI thật.",
    denied: "AI đang tắt vì bạn chưa cho phép ứng dụng dùng Claude. Tải lại trang, gửi tin nhắn và chọn Cho phép để bật AI.",
    disabled: "AI đang tắt vì tài khoản hoặc tổ chức của bạn chưa bật tính năng cho ứng dụng dùng Claude.",
    unavailable: "AI không khả dụng với tài khoản hoặc cách mở trang này. Thử mở link bằng tài khoản Claude khác, hoặc hỏi quản trị viên tổ chức của bạn.",
    prompt: "Ứng dụng cần bạn cho phép dùng Claude. Lượt dùng tính vào tài khoản của bạn."
  }[AI.status] || "";
}
async function aiInit() {
  if (!HAS_HOST) return;
  const sample = await samplePromise;
  if (!sample) { AI.status = "unavailable"; S.aiOff = true; return aiRefresh(); }
  let st = "prompt";
  try { const p = await permsPromise; if (p) st = await p.state("sample"); } catch (e) {}
  AI.status = st === "granted" ? "ready" : st === "denied" ? "denied" : st === "unavailable" ? "unavailable" : "prompt";
  if (AI.status === "denied" || AI.status === "unavailable") S.aiOff = true;
  aiRefresh();
}
async function enableAI() {
  const p = await permsPromise; let st = "unavailable";
  try { if (p) st = (await p.request(["sample"]))?.sample || "unavailable"; } catch (e) {}
  if (st === "granted") { AI.status = "ready"; S.aiOff = false; setNotice("Đã bật AI. Bạn gửi lại tin nhắn để Claude trả lời nhé."); }
  else { AI.status = st === "denied" ? "denied" : st === "prompt" ? "prompt" : "unavailable"; S.aiOff = AI.status !== "prompt"; setNotice(aiReason(), true); }
}
function aiRefresh() { const n = document.getElementById("noticeSlot"); if (n && n.dataset.ai === "1") setNotice(n.dataset.base || "", true); }
const ERR = { not_granted: "Bạn chưa cho phép ứng dụng dùng Claude.", rate_limited: "Đang có nhiều yêu cầu, thử lại sau ít phút nhé.", refused: "Claude chưa trả lời được tin này, bạn thử nói cách khác nhé.", session_expired: "Phiên đăng nhập đã hết hạn." };
const errText = e => e?.code === "off" ? (aiReason() || "AI chưa khả dụng ở chế độ xem này.") + " Bạn vẫn xem được lịch mẫu của nhóm." : (ERR[e?.code] || "Kết nối gián đoạn, thử lại nhé.");
async function ai(kind, input, opts = {}) {
  const sample = await samplePromise;
  if (!sample || S.aiOff) throw { code: "off" };
  try { const r = kind === "json" ? await sample.json(input, { cache: false, ...opts }) : await sample(input, { cache: false, ...opts }); AI.status = "ready"; return r; }

function drawLog(pending = null) {
  const c = comp(), log = document.getElementById("chatlog"); if (!log) return;
  log.innerHTML = S.turns.map(t => t.role === "user"

function drawQuick() {
  const q = document.getElementById("quick"); if (!q) return;

async function sendMsg(text, phase) {
  text = (text || "").trim(); if (!text || busy) return;
  if (phase !== undefined && phase > S.phase) S.phase = phase;
  busy = true;
  S.turns.push({ role: "user", content: text });
  const ta = document.getElementById("msg"); if (ta) { ta.value = ""; ta.style.height = "auto"; }
  chatRefreshHeader(); drawLog(""); drawQuick();
  document.getElementById("send").disabled = true;
  const convo = S.turns.filter(t => !t.local).slice(-20).map(t => ({ role: t.role, content: t.content }));
  const input = [{ role: "user", content: rules() + `\n\nBạn đang ở bước ${S.phase + 1} (${PHASES[S.phase]}).\nBạn đã mở lời: "${S.turns[0].content}"` }, { role: "assistant", content: "Mình hiểu rồi." }, ...convo];
  try {
    const r = await ai("text", input, { modelTier: "quick", onText: ({ text }) => { const live = document.getElementById("live"); if (live) { live.innerHTML = fmt(text); const log = document.getElementById("chatlog"); log.scrollTop = log.scrollHeight; } } });
    S.turns.push({ role: "assistant", content: r.text.trim() });
    setNotice("");
  } catch (e) {
    if (e?.code === "off") {
      const k = DEMO.findIndex(d => d.text === text);
      await wait(900);
      S.turns.push({ role: "assistant", content: k >= 0 ? SCRIPT[k] : scriptOther(), demo: true });
      setNotice(DEMO_NOTE, true);
    } else {
      if (e?.text) S.turns.push({ role: "assistant", content: e.text });
      setNotice(errText(e));
    }
  }
  busy = false;
  if (STEPS[S.step] === "chat") { drawLog(); drawQuick(); const s = document.getElementById("send"); if (s) s.disabled = false; }
}
function chatRefreshHeader() { phone.querySelectorAll("[data-phase]").forEach((b, i) => { b.classList.toggle("done", i < S.phase); if (i === S.phase) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); }); }
function setNotice(t, withAi = false) {
  const n = document.getElementById("noticeSlot"); if (!n) return;
  n.dataset.ai = withAi ? "1" : ""; n.dataset.base = t || "";
  const why = withAi ? aiReason() : "";
  const act = !withAi ? "" : AI.status === "prompt" ? '<button class="aibtn" id="aiOn">Bật AI</button>' : AI.status === "denied" ? '<button class="aibtn" id="aiReload">Tải lại trang</button>' : "";
  n.innerHTML = t || why ? `<div class="notice">${t ? esc(t) : ""}${t && why ? "<br>" : ""}${why ? `<b>${esc(why)}</b>` : ""}${act}</div>` : "";
  const on = document.getElementById("aiOn"); if (on) on.onclick = enableAI;
  const rl = document.getElementById("aiReload"); if (rl) rl.onclick = () => location.reload();
}

async function makePlan() {

  const prompt = `${rules()}

Hội thoại đến giờ:
${transcript || "(chưa có)"}

Thông tin tình huống dùng khi hội thoại còn thiếu: làm 8:00-18:00 thứ 2 đến thứ 6; học online 8:00-12:00 thứ 7 và chủ nhật; buổi tối học được từ ${S.start} đến ${S.endStudy}. Bài tuần này: ${DEMO[2].text}
${S.extra.length ? "Phát sinh mới: " + S.extra.join("; ") : ""}

Trả lời CHỈ bằng JSON đúng dạng:
{"can": số giờ cần, "co": số giờ buổi tối có sẵn, "qua_tai": true/false, "canh_bao": "1-2 câu", "uu_tien": [{"viec": "...", "han": "...", "ly_do": "..."}], "lich": [{"ngay": "Thứ 2", "gio": "19:30 - 21:00", "viec": "...", "loai": "hoc" | "lam" | "nghi" | "ngu"}]}`;

function addCase(d, lv, demo = false) {
  const look = LOOKS[CASES.length % LOOKS.length];
  CASES.push({ id: "c" + Date.now(), custom: demo ? "demo" : true, name: d.name, age: d.age, level: LEVELS[lv][0], lv: lv + 1,
    color: look[0], lobes: look[1], amp: look[2], mood: look[3], brief: d.brief, opening: d.opening, profile: d.profile, demo: d.demo });
  P.ci = CASES.length - 1;
}
async function makeCase() {
  G.state = "loading"; G.msg = ""; practice();
  const taken = CASES.map(c => c.name).join(", ");
  const prompt = `Bạn thiết kế thân chủ GIẢ ĐỊNH cho bài luyện tập tham vấn của sinh viên ngành Tâm lý học tại Việt Nam.

Trả lời CHỈ bằng JSON:
{"name": "tên", "age": số, "brief": "1 câu tóm tắt cho hồ sơ ban đầu", "opening": "câu đầu tiên thân chủ nói khi vào phòng, xưng em", "profile": "hồ sơ 3-4 câu: hoàn cảnh, tính cách theo mức độ, và dòng 'Thông tin chỉ kể khi được hỏi khéo: ...'", "demo": ["4 câu thân chủ có thể nói lần lượt trong buổi, câu thứ 3 hé lộ thông tin ẩn"]}`;
  try {
    const d = await ai("json", prompt, { modelTier: "default" });
    if (!d || !d.name || !d.opening || !d.profile) throw { code: "invalid_json" };
    addCase({ name: String(d.name).slice(0, 20), age: Number(d.age) || 20, brief: String(d.brief || ""), opening: String(d.opening), profile: String(d.profile), demo: Array.isArray(d.demo) && d.demo.length ? d.demo.map(String).slice(0, 4) : DEMO_CASES[0].demo }, G.level);
    G.state = "idle"; G.open = false;
  } catch (e) {
    if (e?.code === "off") {
      const d = DEMO_CASES[G.level];
      if (!CASES.some(c => c.name === d.name)) { addCase(d, G.level, true); G.open = false; G.msg = ""; }
      else G.msg = "Bản demo có sẵn 1 thân chủ mẫu cho mỗi mức độ, bạn đã tạo thân chủ mức này rồi. Thử mức khác nhé.";
      if (!G.open) G.msg = "";

      setTimeout(() => { if (STEPS[S.step] === "practice") { practice(); if (!G.open) { const n = document.querySelector(".choice[aria-pressed=\"true\"]"); n && n.scrollIntoView({ block: "center" }); } } }, 0);
      return;
    }
    G.state = "idle"; G.msg = errText(e);
  }
  if (STEPS[S.step] === "practice") { practice(); const n = document.querySelector('.choice[aria-pressed="true"]'); n && n.scrollIntoView({ block: "center" }); }
}

- Chỉ tiết lộ thông tin ẩn khi người dùng dùng kỹ năng tốt (câu hỏi mở, phản ánh cảm xúc, không phán xét). Nếu bị khuyên vội, phán xét hoặc hỏi dồn, hãy thu mình lại một cách tự nhiên.
- Không mô tả cách thức tự làm hại bản thân dưới bất kỳ hình thức nào.
- Nếu người dùng viết "[thoát vai]", dừng nhập vai và trả lời ngắn rằng buổi luyện tập đã dừng.`;

function drawRoom(pending = null) {
  const c = pcase(), log = document.getElementById("chatlog"); if (!log) return;
  log.innerHTML = P.turns.map(t => t.role === "user"
    ? `<div class="msg me"><div class="bubble">${fmt(t.content)}</div></div>`
    : `<div class="msg ai"><span class="av">${blob(c.color, c.lobes, c.amp, 28, c.mood)}</span><div class="bubble">${fmt(t.content)}</div></div>`).join("")
    + (pending !== null ? `<div class="msg ai"><span class="av">${blob(c.color, c.lobes, c.amp, 28, c.mood)}</span><div class="bubble" id="live">${pending ? fmt(pending) : '<span class="typing" aria-label="Đang trả lời"><b></b><b></b><b></b></span>'}</div></div>` : "");
  log.scrollTop = log.scrollHeight;
}
async function sayRoom(text) {
  text = (text || "").trim(); if (!text || P.busy) return;
  P.busy = true; P.turns.push({ role: "user", content: text });
  const ta = document.getElementById("msg"); if (ta) { ta.value = ""; ta.style.height = "auto"; }
  drawRoom(""); document.getElementById("send").disabled = true;
  const input = [{ role: "user", content: roomPrompt() + "\n\nHãy bắt đầu nhập vai. Câu mở đầu của bạn là:" }, ...P.turns.slice(-24).map(t => ({ role: t.role, content: t.content }))];
  try {
    const r = await ai("text", input, { modelTier: "quick", onText: ({ text }) => { const live = document.getElementById("live"); if (live) { live.innerHTML = fmt(text); const log = document.getElementById("chatlog"); log.scrollTop = log.scrollHeight; } } });
    P.turns.push({ role: "assistant", content: r.text.trim() }); setNotice("");
  } catch (e) {
    if (e?.code === "off") {
      await wait(900);
      const n = P.turns.filter(t => t.role === "user").length - 1;
      const lines = pcase().demo;
      P.turns.push({ role: "assistant", content: lines[Math.min(n, lines.length - 1)] });
      setNotice("Bản demo: câu trả lời của thân chủ là kịch bản viết sẵn, không phải AI nhập vai trực tiếp.", true);
    } else { if (e?.text) P.turns.push({ role: "assistant", content: e.text }); setNotice(errText(e)); }
  }
  P.busy = false;
  if (STEPS[S.step] === "room") { drawRoom(); document.getElementById("send").disabled = false; const end = document.getElementById("end"); if (end) end.disabled = P.turns.filter(t => t.role === "user").length < 2; }
}

${transcript}

Trả lời CHỈ bằng JSON:
{"tom_tat": "1-2 câu về diễn biến buổi", "diem_manh": ["2-3 điểm"], "can_luyen": ["2-3 điểm"], "ky_nang": [{"ten": "tên kỹ năng vi mô đã dùng, ví dụ Câu hỏi mở, Phản ánh cảm xúc, Diễn giải, Tóm tắt", "vi_du": "trích câu của sinh viên"}], "cau_thay_the": [{"goc": "một câu sinh viên đã nói có thể tốt hơn", "goi_y": "cách nói khác"}], "luu_y": "lưu ý về an toàn hoặc chuyển tuyến nếu cần, nếu không thì để rỗng"}`;
  try {
    const r = await ai("json", prompt, { modelTier: "default" });
    if (!r || !Array.isArray(r.diem_manh)) throw { code: "invalid_json" };
    P.review = r; P.reviewDemo = false; P.reviewState = "done";
  } catch (e) {
    if (e?.code === "off") { await wait(1000); P.review = DEMO_REVIEW; P.reviewDemo = true; P.reviewState = "done"; }
    else { P.reviewState = "error"; P.reviewMsg = errText(e); }
  }
  if (STEPS[S.step] === "review") review();
}
function review() {
  const c = pcase(), r = P.review;
  let content;
  if (P.reviewState === "loading") content = `<div class="thinking"><span class="bob">${blob(c.color, c.lobes, c.amp, 72, c.mood)}</span><p>Đang đọc lại buổi luyện tập với ${c.name}...</p></div>`;
  else if (P.reviewState === "error") content = `<div class="thinking"><p>${esc(P.reviewMsg)}</p><button class="btn small" id="retry">Thử lại</button></div>`;
  else if (r) {
    const list = (t, a, col) => a?.length ? `<div class="prio"><h2>${t}</h2>${a.map((x, i) => `<div class="prio-item"><span class="n" style="background:${col}">${i + 1}</span><div class="t">${esc(x)}</div></div>`).join("")}</div>` : "";
    content = `${r.tom_tat ? `<p class="meter" style="font-size:14px">${esc(r.tom_tat)}</p>` : ""}
      ${list("Bạn đã làm tốt", r.diem_manh, "var(--teal)")}
      ${list("Thử luyện thêm", r.can_luyen, "var(--butter)")}
      ${r.ky_nang?.length ? `<div class="day"><h2>Kỹ năng đã dùng</h2>${r.ky_nang.map(k => `<div class="blk hoc"><span class="tm">${esc(k.ten)}</span><span>"${esc(k.vi_du)}"</span></div>`).join("")}</div>` : ""}
      ${r.cau_thay_the?.length ? `<div class="day"><h2>Một cách nói khác</h2>${r.cau_thay_the.map(k => `<div class="blk"><span class="tm">Bạn nói</span><span>"${esc(k.goc)}"</span></div><div class="blk nghi"><span class="tm">Thử nói</span><span>"${esc(k.goi_y)}"</span></div>`).join("")}</div>` : ""}
      ${r.luu_y ? `<p class="warnbox">${esc(r.luu_y)}</p>` : ""}
      <p class="hint">${P.reviewDemo ? "Bản demo: phản hồi mẫu viết sẵn, không phải AI đọc buổi của bạn. " + aiReason() + " " : ""}Phản hồi chỉ để luyện tập, không đánh giá năng lực chuyên môn. Hãy trao đổi thêm với giảng viên hướng dẫn.</p>`;
  }
  phone.innerHTML = `${head(true)}
  <div class="body" style="padding-top:0"><h1 style="font-size:26px">Nhìn lại buổi luyện tập</h1><p class="sub">Với ${c.name} · ${P.turns.filter(t => t.role === "user").length} lượt nói của bạn</p>${content}</div>
  <div class="foot"><button class="btn" id="again">Luyện lại với ${esc(c.name)}</button><button class="btn light" id="newcase">Tạo thân chủ mới</button><p class="hint"><button class="link" id="other">Chọn thân chủ khác</button></p></div>`;
  bindBack(STEPS.indexOf("room"));
  const rt = document.getElementById("retry"); if (rt) rt.onclick = makeReview;
  document.getElementById("again").onclick = () => { P.turns = [{ role: "assistant", content: c.opening }]; P.review = null; P.reviewState = "idle"; go(STEPS.indexOf("room")); };
  document.getElementById("other").onclick = () => go(STEPS.indexOf("practice"));
  document.getElementById("newcase").onclick = () => { G.open = true; G.msg = ""; go(STEPS.indexOf("practice")); };
}

try { const h = location.hash.slice(1); const i = STEPS.indexOf(h); if (i >= 0) S.step = i; } catch {}
render();
aiInit();
})();
</script>
</body>
</html>
